# 首頁抽牌籤池。每一類 24 則。
# 愛情、事業、財運各按語氣排成：大吉 6、吉 9、平 9。最平淡到「平」為止。
# 順序只方便閱讀，抽牌時會打亂。
# 神諭是神明與一句話的配對，語氣有亮有沉，用來翻一個小念頭。

love:
  # 大吉
  - "有人帶著喜歡靠近。你不用先變成更好的版本。"
  - "今天一句真心，會被好好接住。"
  - "你想念的人，心裡也留著你的位置。"
  - "沒說完的溫柔，今天補得上去。對方聽得見。"
  - "兩個人容易站到同一邊。一件小事就能靠近。"
  - "心門開了一縫。光進來時，你也站在光裡。"
  # 吉
  - "有人用很笨的方式在乎你。你先笑一下就好。"
  - "舊的好感還在。今天輕輕問一句，勝過一直猜。"
  - "眼神會比話先到。你把抬頭這件事留著。"
  - "吵過的地方，今天能放下一小塊。"
  - "你的在意對方有收到。他只是表達得比較慢。"
  - "適合見一個短短的面。久了會累，短了正好。"
  - "一句平常的問候，今天會變成讓人微笑的事。"
  - "你想起某個人時，剛好也是對方輕鬆的時刻。"
  - "感情裡的小事今天都對得上。一起吃頓飯就很夠。"
  # 平
  - "感情像溫水。沒有火花，也沒有裂痕。"
  - "想聯絡就聯絡，想安靜就安靜。兩邊都好。"
  - "關係停在原地。今天就在原地歇一下腳。"
  - "心裡有一點蕩。名字先別取，看過今天再說。"
  - "對方過對方的，你過你的。晚上再把日子對上。"
  - "沒有新的告白，也沒有新的告別。這樣也算一天。"
  - "關係維持在熟悉的樣子。熟悉本身就很安穩。"
  - "今天沒有需要趕的事。感情停在剛好的距離。"
  - "想聊天就聊天，想各忙各的也好。人還在原處。"

career:
  # 大吉
  - "準備很久的那件事，今天有人看得見。"
  - "開口提那個想法。正好有人需要它。"
  - "卡關的地方會鬆開一點。你順著往下做。"
  - "今天的努力，會被記在對的人眼裡。"
  - "適合做決定。你心裡早就有答案了。"
  - "合作會順。你出一分，對方也出得起一分。"
  # 吉
  - "有一件小事會做得很乾淨。從那件開始。"
  - "願意回你訊息的那個人，就是今天的貴人。"
  - "挑一個小地方弄懂。弄懂一處，整天就亮了。"
  - "該問的，今天問得出來。對方也願意答。"
  - "路是通的。你把腳步放大一點就好。"
  - "成果拿出去剛剛好。再改，就改掉你自己了。"
  - "手上的事今天有一段完整時間，可以一次做完。"
  - "你的做法會被看成加分。照自己的節奏交出去。"
  - "進度穩穩往前。這條路你走起來認得。"
  # 平
  - "今天把該做的做完，這一天就合格了。"
  - "沒有突然的機會，也沒有突然的麻煩。"
  - "進度普通。事情還好好地在你手上。"
  - "訊息很多，空檔很少。真正的工作放進空檔。"
  - "方向沒有變。今天照著舊路走完就好。"
  - "做得完的做完，做不完的留到明天。"
  - "今天的工作量剛剛好。做完手上這些就可以收工。"
  - "事情照昨天的安排走。你跟著走完，就很整齊。"
  - "話今天一句一句說得清楚。對完，日子就過去了。"

wealth:
  # 大吉
  - "有一筆該來的會找到你。你把帳看清楚。"
  - "今天適合收下。推得太客氣，連好運也出門了。"
  - "小錢會帶來一個開口。開口後面還有空間。"
  - "花出去的那一份，會換一種樣子走回來。"
  - "買該買的就好。撐場面的那些，今天可以不買。"
  - "有人記得你的份。遲來的那一份會露面。"
  # 吉
  - "把散落的帳聚攏。聚攏本身就像進了一筆。"
  - "一點優惠、一頓省下的錢，都算今天的吉。"
  - "可以談價錢。你開口，對方聽得進去。"
  - "舊的東西還能用。先看看家裡，再看看架子。"
  - "花一點在自己身上的小學習，今天花得值。"
  - "會出現一小筆意外的錢。不大，可是它是真的。"
  - "結帳時數字清楚。每一筆都花在你想要的地方。"
  - "今天的支出都在預算裡。花完還留著一點餘裕。"
  - "該到的錢照時間來。你就照自己的日子過。"
  # 平
  - "不進不出。守住今天，就守住這個月的一角。"
  - "數字看起來普通。普通的意思是沒有破洞。"
  - "想買的先放進清單。清單不會今天漲價。"
  - "收入如常。如常是一種很穩的富有。"
  - "沒有橫財，也沒有漏財。乾淨地過完這一天。"
  - "帳是平的。適合把下一次的預算慢慢寫下來。"
  - "錢包維持平常的厚度。平常夠用，今天也夠用。"
  - "帳目跟昨天一樣清楚。看一眼，心就安了。"
  - "想買的還在原處。今天買或不買，都剛剛好。"

deity:
  - name: "觀世音菩薩"
    line: "你不用先變得很好，才值得被溫柔對待。"
  - name: "釋迦牟尼佛"
    line: "今天壞掉的地方，先坐下來看看。看清楚就小了一圈。"
  - name: "彌勒佛"
    line: "很多事笑一下就消化了。我的肚子可以作證。"
  - name: "地藏菩薩"
    line: "你在暗處還願意留一盞小燈。小燈就很夠。"
  - name: "媽祖"
    line: "風大就先收帆。岸還在，不必跟今天的浪爭。"
  - name: "關聖帝君"
    line: "義氣是扛該扛的。今天能不爭的，就讓它過去。"
  - name: "土地公"
    line: "走到這裡就可以坐一下。這條路又不會跑掉。"
  - name: "月老"
    line: "線今天鬆鬆的。鬆一點，兩個人才喘得過氣。"
  - name: "財神爺"
    line: "口袋空的時候，眼睛通常比較亮。這也算財運。"
  - name: "太上老君"
    line: "你越想握住今天，它越從指縫溜走。手鬆著，它還在。"
  - name: "哪吒"
    line: "重來一次不丟臉。我也是摔了很多次才踏上輪子。"
  - name: "孫悟空"
    line: "頭會痛，常常是因為你還在跟那圈金箍較勁。"
  - name: "玉皇大帝"
    line: "天上今天不上班。你地上的小決定，自己點頭就行。"
  - name: "天照大神"
    line: "躲進洞裡休息沒關係。我躲過。出來的時候再發光。"
  - name: "象神甘尼許"
    line: "路中間的障礙有時是在問：要不要換一條更像你的路。"
  - name: "濕婆"
    line: "有些東西要先放下，位置才空得出來。你抓著的是什麼。"
  - name: "宙斯"
    line: "雷聲很大，雨未必下在你頭上。先看雲往哪走。"
  - name: "雅典娜"
    line: "真正的聰明，是知道哪一仗今天根本不用打。"
  - name: "維納斯"
    line: "愛裡留一點不完美給對方看。太完整，別人靠不過來。"
  - name: "阿波羅"
    line: "光太直會刺眼。讓它從側面來，你比較看得清。"
  - name: "索爾"
    line: "錘子那麼重，所以不是每一口悶氣都要砸下去。"
  - name: "伊西斯"
    line: "碎了可以再拼。拼好的那一個，會有新的名字。"
  - name: "耶穌"
    line: "你背上有一半是別人的負擔。那一半今天可以放下。"
  - name: "聖母瑪利亞"
    line: "你忙著照顧所有人時，記得給自己也留一把椅子。"
